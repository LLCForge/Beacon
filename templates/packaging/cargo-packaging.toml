# Cargo.toml fragment for {{name}} packaging. Paste both tables at the end of
# the tool's Cargo.toml (sync.py does not edit Cargo.toml). The release
# workflow runs `cargo deb --no-build --target <triple>` and
# `cargo generate-rpm --target <triple>`; both rewrite target/release/ to
# target/<triple>/release/ automatically.

[package.metadata.deb]
# Replace with the project's packaging contact before the first release.
maintainer = "LLCForge contributors <https://github.com/LLCForge>"
copyright = "2026, LLCForge contributors"
license-file = ["LICENSE", "0"]
extended-description = "{{description}}"
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/{{bin}}", "usr/bin/", "755"],
    ["{{bin}}.example.toml", "etc/{{bin}}/{{bin}}.toml", "644"],
    ["README.md", "usr/share/doc/{{bin}}/README.md", "644"],
    ["NOTICE", "usr/share/doc/{{bin}}/NOTICE", "644"],
]
conf-files = ["/etc/{{bin}}/{{bin}}.toml"]
# Installs packaging/systemd/{{bin}}.service and the matching maintainer scripts;
# the unit is not enabled automatically (configure first, then enable).
systemd-units = { unit-name = "{{bin}}", unit-scripts = "packaging/systemd", enable = false, start = false }

[package.metadata.generate-rpm]
license = "MIT"
summary = "{{description}}"
assets = [
    { source = "target/release/{{bin}}", dest = "/usr/bin/{{bin}}", mode = "755" },
    { source = "packaging/systemd/{{bin}}.service", dest = "/usr/lib/systemd/system/{{bin}}.service", mode = "644" },
    { source = "{{bin}}.example.toml", dest = "/etc/{{bin}}/{{bin}}.toml", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/{{bin}}/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/{{bin}}/LICENSE", mode = "644", doc = true },
]
post_install_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
post_uninstall_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
